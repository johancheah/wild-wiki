<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}WILD Gaming{% endblock %}</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version() }}">
</head>
<body>
  {% import "macros.html" as ui %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img class="brand-logo" src="/static/logo.png" alt="WILD Gaming"></a>
      {% if nav_player %}
      <div class="nav-player" id="nav-player">
        <span class="player-switcher">
          <button class="player-switcher-btn" type="button" aria-haspopup="true" aria-expanded="false">
            {{ ui.avatar(nav_player.display_name, nav_player.headshot_filename) }}
            <span class="player-switcher-name">{{ nav_player.display_name }}</span>
            <span class="player-switcher-caret">&#9662;</span>
          </button>
          {{ ui.player_switcher_dropdown(nav_player.player_id, nav_roster) }}
        </span>
      </div>
      {% endif %}
      <nav class="desktop-nav">
        {{ ui.nav_links(active) }}
      </nav>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">&#9776;</button>
    </div>
    <nav class="mobile-menu" id="mobile-menu">
      {{ ui.nav_links(active) }}
    </nav>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
  <script>
    // Mobile hamburger menu: toggles the .mobile-menu dropdown (hidden on
    // desktop widths via CSS regardless of this class) and swaps the
    // button glyph between hamburger/close.
    (function () {
      var toggle = document.getElementById("nav-toggle");
      var menu = document.getElementById("mobile-menu");
      if (!toggle || !menu) return;
      toggle.addEventListener("click", function () {
        var open = menu.classList.toggle("open");
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        toggle.innerHTML = open ? "&#10005;" : "&#9776;";
      });
      menu.querySelectorAll("a").forEach(function (a) {
        a.addEventListener("click", function () {
          menu.classList.remove("open");
          toggle.setAttribute("aria-expanded", "false");
          toggle.innerHTML = "&#9776;";
        });
      });
    })();

    // Player detail page only: the compact avatar+name in the nav bar
    // fades/slides in once the page's own big player header has scrolled
    // past.
    (function () {
      var navPlayer = document.getElementById("nav-player");
      if (!navPlayer) return;
      var threshold = 220;
      function onScroll() {
        navPlayer.classList.toggle("visible", window.scrollY > threshold);
      }
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll();
    })();

    // Generic player-switcher dropdown: every .player-switcher on the page
    // (the nav-bar one, and the page-header one on the player detail page
    // itself) gets independent open/close, closing any other open one
    // first so only one dropdown is ever open at a time.
    (function () {
      var switchers = document.querySelectorAll(".player-switcher");
      if (!switchers.length) return;

      function closeAll() {
        document.querySelectorAll(".player-switcher-dropdown.open").forEach(function (d) { d.classList.remove("open"); });
        document.querySelectorAll('.player-switcher-btn[aria-expanded="true"]').forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
      }

      switchers.forEach(function (switcher) {
        var btn = switcher.querySelector(".player-switcher-btn");
        var dropdown = switcher.querySelector(".player-switcher-dropdown");
        if (!btn || !dropdown) return;
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var willOpen = !dropdown.classList.contains("open");
          closeAll();
          if (willOpen) {
            dropdown.classList.add("open");
            btn.setAttribute("aria-expanded", "true");
          }
        });
      });
      document.addEventListener("click", closeAll);
    })();

    // Generic tab-toggle: every .tab-btn/.tab-panel pair is scoped by a
    // shared data-group, so multiple tab groups (e.g. nested per-map tabs
    // inside an outer Overall/Map1/Map2 group on the match-week page) can
    // coexist on one page without their clicks colliding.
    document.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var group = btn.dataset.group;
        document.querySelectorAll('.tab-btn[data-group="' + group + '"]').forEach(function (b) { b.classList.remove("active"); });
        document.querySelectorAll('.tab-panel[data-group="' + group + '"]').forEach(function (p) { p.classList.add("hidden"); });
        btn.classList.add("active");
        document.getElementById("tab-" + group + "-" + btn.dataset.tab).classList.remove("hidden");
      });
    });

    // Generic click-to-sort: any table with class="sortable-table" gets
    // per-column sorting driven by each <th data-sort-type="...">. A cell
    // can override what actually gets compared via td[data-value] (e.g. an
    // ISO date under a "MMM DD, YY" display string) — falls back to the
    // cell's own text otherwise.
    document.querySelectorAll(".sortable-table").forEach(function (table) {
      var headers = table.querySelectorAll("thead th");
      var tbody = table.querySelector("tbody");
      var state = { col: null, dir: 1 };

      function cellValue(td, type) {
        var raw = td.dataset.value !== undefined ? td.dataset.value : td.textContent.trim();
        if (type === "string" || type === "date") return String(raw).toLowerCase();
        // Only the "no data" placeholder (—) means null — a leading "-" is
        // a real negative sign (e.g. a +/- column) and must survive so
        // parseFloat keeps it, not get stripped like the placeholder.
        var text = String(raw).replace("%", "").trim();
        if (text === "" || text === "—") return null;
        var n = parseFloat(text);
        return isNaN(n) ? null : n;
      }

      headers.forEach(function (th, i) {
        if (!th.dataset.sortType) return;
        th.addEventListener("click", function () {
          var type = th.dataset.sortType || "num";
          var dir = state.col === i ? -state.dir : type === "string" || type === "date" ? 1 : -1;
          state = { col: i, dir: dir };

          headers.forEach(function (h) { h.classList.remove("sort-asc", "sort-desc"); });
          th.classList.add(dir === 1 ? "sort-asc" : "sort-desc");

          var rows = Array.prototype.slice.call(tbody.querySelectorAll("tr"));
          rows.sort(function (a, b) {
            var av = cellValue(a.children[i], type);
            var bv = cellValue(b.children[i], type);
            if (av === null && bv === null) return 0;
            if (av === null) return 1;
            if (bv === null) return -1;
            if (av < bv) return -1 * dir;
            if (av > bv) return 1 * dir;
            return 0;
          });
          rows.forEach(function (r) { tbody.appendChild(r); });
        });
      });
    });
  </script>
</body>
</html>
